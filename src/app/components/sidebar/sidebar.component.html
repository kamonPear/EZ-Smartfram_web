<!-- Hamburger Button - ลอยอยู่มุมซ้ายบนทุกหน้า -->
<button class="hamburger-btn" (click)="toggle()" [class.open]="isOpen()">
  <span class="bar bar-1"></span>
  <span class="bar bar-2"></span>
  <span class="bar bar-3"></span>
</button>

<button class="back-btn"  (click)="goBack()" [class.hidden-while-open]="isOpen()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/>
    <polyline points="12 19 5 12 12 5"/>
  </svg>
</button>-->

<!-- Overlay กดพื้นหลังเพื่อปิด Sidebar -->
<div class="sidebar-overlay" [class.visible]="isOpen()" (click)="close()"></div>

<!-- Sidebar Panel -->
<aside class="sidebar" [class.open]="isOpen()">
  <!-- Header ของ Sidebar -->
  <div class="sidebar-header">
    <img src="assets/images/logo.png" alt="EZ Smart Farm Logo" class="sidebar-logo">
    <div class="sidebar-title">
      <span class="title-main">EZ-SmartFarm</span>
      <span class="title-sub">เมนูหลัก</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      (click)="close()"
    >
      <div class="nav-icon">
        <img [src]="item.icon" [alt]="item.label">
      </div>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>

  <button class="theme-toggle-row" (click)="toggleTheme()">
    <div class="nav-icon theme-toggle-icon">
      <svg *ngIf="isDarkTheme()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <svg *ngIf="!isDarkTheme()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
      </svg>
    </div>
    <span class="nav-label">{{ isDarkTheme() ? 'โหมดมืด' : 'โหมดสว่าง' }}</span>
    <span class="theme-switch" [class.on]="!isDarkTheme()">
      <span class="theme-switch-knob"></span>
    </span>
  </button>

  <div class="sidebar-footer">
    <span>EZ-SmartFarm v1.0</span>
  </div>
</aside>
