<!-- Hamburger Button - ลอยอยู่มุมซ้ายบนทุกหน้า -->
<button class="hamburger-btn" (click)="toggle()" [class.open]="isOpen()">
  <span class="bar bar-1"></span>
  <span class="bar bar-2"></span>
  <span class="bar bar-3"></span>
</button>

<!-- Back Button - ลอยอยู่ข้างปุ่มแฮมเบอเกอร์ทุกหน้า 
<button class="back-btn"  (click)="goBack()" [class.hidden-while-open]="isOpen()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/>
    <polyline points="12 19 5 12 12 5"/>
  </svg>
</button>-->

<!-- Overlay กดพื้นหลังเพื่อปิด Sidebar -->
<div class="sidebar-overlay" [class.visible]="isOpen()" (click)="close()"></div>

<!-- Sidebar Panel -->
<aside class="sidebar" [class.open]="isOpen()">
  <!-- Header ของ Sidebar -->
  <div class="sidebar-header">
    <img src="assets/images/logo.png" alt="EZ Smart Farm Logo" class="sidebar-logo">
    <div class="sidebar-title">
      <span class="title-main">EZ-SmartFarm</span>
      <span class="title-sub">เมนูหลัก</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      (click)="close()"
    >
      <div class="nav-icon">
        <img *ngIf="item.icon" [src]="item.icon" [alt]="item.label">
        <svg *ngIf="item.svgIcon === 'health'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/>
          <path d="M6.5 12h2l1.5-2.5L12 14l1.5-3h2.5"/>
        </svg>
        <svg *ngIf="item.svgIcon === 'notification'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <svg *ngIf="item.svgIcon === 'backup'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/>
          <polyline points="8 17 12 21 16 17"/>
          <line x1="12" y1="12" x2="12" y2="21"/>
        </svg>
        <svg *ngIf="item.svgIcon === 'search'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <svg *ngIf="item.svgIcon === 'food'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
          <path d="m3.3 7 8.7 5 8.7-5"/>
          <path d="M12 22V12"/>
        </svg>
        <!-- สถานะอุปกรณ์ - เส้นกราฟสัญญาณ สื่อถึงการมอนิเตอร์สถานะ -->
        <svg *ngIf="item.svgIcon === 'device-status'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        <!-- วางอุปกรณ์เซนเซอร์ - ไอคอนชิป/วงจร คนละแบบกับสถานะอุปกรณ์ด้านบน -->
        <svg *ngIf="item.svgIcon === 'device-place'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="6" width="12" height="12" rx="1.5"/>
          <rect x="9.5" y="9.5" width="5" height="5"/>
          <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
        </svg>
      </div>
      <span class="nav-label">{{ item.label }}</span>
      <span class="nav-badge" *ngIf="item.svgIcon === 'notification' && notificationCount > 0">{{ notificationCount }}</span>
    </a>
  </nav>

  <button class="theme-toggle-row" (click)="toggleTheme()">
    <div class="nav-icon theme-toggle-icon">
      <svg *ngIf="isDarkTheme()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <svg *ngIf="!isDarkTheme()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
      </svg>
    </div>
    <span class="nav-label">{{ isDarkTheme() ? 'โหมดมืด' : 'โหมดสว่าง' }}</span>
    <span class="theme-switch" [class.on]="!isDarkTheme()">
      <span class="theme-switch-knob"></span>
    </span>
  </button>

  <!-- ติดต่อเรา: กดเพื่อกางรายชื่อ/เบอร์โทร (กดเบอร์เพื่อโทรบนมือถือได้) -->
  <button class="theme-toggle-row contact-toggle-row" type="button" (click)="toggleContact()" [attr.aria-expanded]="showContact()">
    <div class="nav-icon theme-toggle-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/>
      </svg>
    </div>
    <span class="nav-label">ติดต่อเรา</span>
    <span class="contact-chevron" [class.open]="showContact()">&#9662;</span>
  </button>
  <div class="contact-list" *ngIf="showContact()">
    <p class="contact-hint">โทรติดต่อสอบถามการใช้งาน/ปัญหาระบบ</p>
    <a class="contact-item" *ngFor="let c of contactPhones" [href]="telHref(c.phone)">
      <span class="contact-name">{{ c.name }}</span>
      <span class="contact-phone">{{ c.phone }}</span>
    </a>
  </div>

  <div class="sidebar-footer">
    <div class="sidebar-user" *ngIf="currentUsername() as username">
      <span class="sidebar-user-name">{{ username }}</span>
      <button class="sidebar-logout-btn" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        ออกจากระบบ
      </button>
    </div>
    <span>EZ-SmartFarm v1.0</span>
  </div>
</aside>

<!-- ป็อบอัพยืนยันก่อนออกจากระบบ -->
<div class="logout-modal-overlay" *ngIf="showLogoutConfirm()" (click)="cancelLogout()">
  <div class="logout-modal" (click)="$event.stopPropagation()">
    <h3>ยืนยันการออกจากระบบ?</h3>
    <p>คุณต้องการออกจากระบบใช่หรือไม่</p>
    <div class="logout-modal-actions">
      <button class="btn-cancel" (click)="cancelLogout()">ยกเลิก</button>
      <button class="btn-confirm-logout" (click)="confirmLogout()">ออกจากระบบ</button>
    </div>
  </div>
</div>
