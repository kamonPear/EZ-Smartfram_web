<div class="add-vaccine-container">
  <header class="header-section">
    <div class="header-content">
      <div class="logo-container clickable-logo" routerLink="/">
        <img src="assets/images/logo.png" alt="Farm Logo">
      </div>
      <div class="title-group">
        <h1>เพิ่มข้อมูลยาวัคซีน</h1>
      </div>
    </div>
  </header>

  <main class="content-area">
    <div class="form-grid form-grid-single">

      <div class="card info-card">
        <div class="card-title-row">
          <div class="card-title-left">
            <div class="card-title-icon">
             <img src="assets/images/Vaccine.png" alt="Add vaccine">
            </div>
            <h2>วัคซีน</h2>
          </div>
        </div>

        <div class="field-stack">
          <div class="input-pill">
            <span class="input-pill-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <g transform="rotate(45 12 12)">
                  <rect x="9" y="4" width="6" height="10" rx="1"/>
                  <line x1="12" y1="2" x2="12" y2="4"/>
                  <line x1="12" y1="14" x2="12" y2="20"/>
                </g>
              </svg>
            </span>
            <input type="text" [(ngModel)]="medicineName" placeholder="ระบุชื่อยา">
          </div>

          <div class="input-pill input-pill-clickable input-pill-dropdown" [class.active]="isMethodDropdownOpen" (click)="toggleMethodDropdown()">
            <span class="input-pill-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s7-6.4 7-12a7 7 0 0 0-14 0c0 5.6 7 12 7 12Z"/>
                <circle cx="12" cy="10" r="2.5"/>
              </svg>
            </span>
            <span class="input-pill-value" [class.placeholder]="!method">{{ method || 'เลือกวิธีการให้' }}</span>
            <span class="input-pill-chevron" [class.open]="isMethodDropdownOpen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>

            <div class="pill-dropdown" *ngIf="isMethodDropdownOpen" (click)="$event.stopPropagation()">
              <div class="pill-dropdown-item" *ngFor="let m of methodOptions" (click)="selectMethod(m)">{{ m }}</div>
            </div>
          </div>

          <div class="age-range-row">
            <div class="input-pill">
              <span class="input-pill-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"/>
                  <polyline points="12 7 12 12 15.5 14"/>
                </svg>
              </span>
              <input type="number" min="0" [(ngModel)]="minAgeDays" placeholder="อายุต่ำสุด (วัน)">
            </div>

            <span class="age-range-separator">–</span>

            <div class="input-pill">
              <span class="input-pill-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"/>
                  <polyline points="12 7 12 12 15.5 14"/>
                </svg>
              </span>
              <input type="number" min="0" [(ngModel)]="maxAgeDays" placeholder="อายุสูงสุด (วัน)">
            </div>
          </div>

          <div class="input-pill">
            <span class="input-pill-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/>
                <path d="M14 3v5h5"/>
                <line x1="8.5" y1="13" x2="15.5" y2="13"/>
                <line x1="8.5" y1="17" x2="13" y2="17"/>
              </svg>
            </span>
            <input type="text" [(ngModel)]="description" placeholder="คำอธิบาย/หมายเหตุ (ถ้ามี)">
          </div>
        </div>
      </div>

      <div class="pill-dropdown-backdrop" *ngIf="isMethodDropdownOpen" (click)="closeDropdowns()"></div>
    </div>

    <div class="action-row">
      <button class="btn-cancel" routerLink="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
        ยกเลิก
      </button>
      <button class="btn-confirm" (click)="saveVaccine()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        บันทึกข้อมูล
      </button>
    </div>
  </main>
</div>
