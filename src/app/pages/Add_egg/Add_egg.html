<div class="add-egg-container">
  <header class="header-section">
    <div class="header-content">
      <div class="logo-container clickable-logo" routerLink="/">
        <img src="assets/images/logo.png" alt="Farm Logo">
      </div>
      <div class="title-group">
        <h1>เพิ่มข้อมูลไข่ไก่</h1>
      </div>
    </div>
  </header>

  <main class="content-area">
    <div class="form-grid">

      <div class="card calendar-card">
        <div class="calendar-header">
          <button class="nav-btn" (click)="prevMonth()">&lsaquo;</button>
          <span class="month-label">{{ monthLabel }}</span>
          <button class="nav-btn" (click)="nextMonth()">&rsaquo;</button>
        </div>

        <div class="weekday-row">
          <span class="weekday" *ngFor="let d of weekDayLabels">{{ d }}</span>
        </div>

        <div class="week-row" *ngFor="let week of calendarWeeks">
          <button
            class="day-cell"
            *ngFor="let day of week"
            [class.empty]="!day"
            [class.selected]="isSelected(day)"
            [class.today]="isToday(day)"
            [disabled]="!day"
            (click)="selectDay(day)">
            {{ day ? day.getDate() : '' }}
          </button>
        </div>
      </div>

      <div class="card info-card">
        <div class="card-title-row">
          <h2>ไข่ไก่</h2>
          <button class="calendar-icon-btn" title="ใช้วันที่ {{ formatDate(collectDate) }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="17" rx="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
            </svg>
          </button>
        </div>

        <div class="field-row">
          <label>คอก</label>
          <div class="field-input">
            <select [(ngModel)]="coopId">
              <option [ngValue]="null" disabled selected hidden>เลือกคอก</option>
              <option *ngFor="let coop of coops" [ngValue]="coop.coop_id">{{ coop.name_coop }}</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <label>จำนวนไข่</label>
          <div class="field-input">
            <input type="number" [(ngModel)]="eggCount" placeholder="0" min="0">
            <span class="unit">ฟอง</span>
          </div>
        </div>

        <div class="field-row">
          <label>วันที่เก็บไข่</label>
          <div class="field-input">
            <span>{{ formatDate(collectDate) }}</span>
          </div>
        </div>

        <div class="field-row">
          <label>หมายเหตุ</label>
          <div class="field-input">
            <input type="text" [(ngModel)]="note" placeholder="-">
          </div>
        </div>
      </div>

    </div>

    <div class="action-row">
      <button class="btn-cancel" routerLink="/">ยกเลิก</button>
      <button class="btn-confirm" (click)="saveEgg()">บันทึกข้อมูล</button>
    </div>
  </main>
</div>
