<div class="add-egg-container">
  <header class="header-section">
    <div class="header-content">
      <div class="logo-container clickable-logo" routerLink="/">
        <img src="assets/images/logo.png" alt="Farm Logo">
      </div>
      <div class="title-group">
        <h1>เพิ่มข้อมูลไข่ไก่</h1>
      </div>
    </div>
  </header>

  <main class="content-area">
    <div class="form-grid form-grid-single">

      <div class="card info-card">
        <div class="card-title-row">
          <div class="card-title-left">
            <div class="card-title-icon">
               <img src="assets/images/egg.png" alt="Add egg">
            </div>
            <h2>ไข่ไก่</h2>
          </div>
        </div>

        <div class="field-stack">
          <div class="input-pill input-pill-clickable input-pill-dropdown" [class.active]="isCoopDropdownOpen" (click)="toggleCoopDropdown()">
            <span class="input-pill-icon">
              <img src="assets/images/coopchicken.png" alt=" Coop Icon">
            </span>
            <span class="input-pill-value" [class.placeholder]="!coopId">{{ coopId ? selectedCoopName : 'เลือกคอก' }}</span>
            <span class="input-pill-chevron" [class.open]="isCoopDropdownOpen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>

            <div class="pill-dropdown" *ngIf="isCoopDropdownOpen" (click)="$event.stopPropagation()">
              <div class="pill-dropdown-item" *ngFor="let coop of coops" (click)="selectCoop(coop)">{{ coop.name_coop }}</div>
            </div>
          </div>

          <div class="input-pill">
            <span class="input-pill-icon">
              <img src="assets/images/egg.png" alt="Add egg">
            </span>
            <input type="number" [(ngModel)]="eggCount" placeholder="จำนวนไข่" min="0">
            <span class="input-pill-suffix">ฟอง</span>
          </div>

          <div class="input-pill input-pill-clickable" [class.active]="isCalendarOpen" (click)="openCalendar()">
            <span class="input-pill-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="17" rx="2"/>
                <line x1="3" y1="9" x2="21" y2="9"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
              </svg>
            </span>
            <span class="input-pill-value" [class.placeholder]="!collectDate">{{ collectDate ? formatDate(collectDate) : 'วันที่เก็บไข่' }}</span>
            <span class="input-pill-action">เลือกวันที่</span>
          </div>

          <div class="input-pill">
            <span class="input-pill-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/>
                <path d="M14 3v5h5"/>
                <line x1="8.5" y1="13" x2="15.5" y2="13"/>
                <line x1="8.5" y1="17" x2="13" y2="17"/>
              </svg>
            </span>
            <input type="text" [(ngModel)]="note" placeholder="หมายเหตุ (ถ้ามี)">
          </div>
        </div>
      </div>

      <div class="pill-dropdown-backdrop" *ngIf="isCoopDropdownOpen" (click)="closeDropdowns()"></div>
    </div>

    <div class="action-row">
      <button class="btn-cancel" routerLink="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
        ยกเลิก
      </button>
      <button class="btn-confirm" (click)="saveEgg()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        บันทึกข้อมูล
      </button>
    </div>
  </main>

  <app-date-picker-calendar
    *ngIf="isCalendarOpen"
    title="วันที่เก็บไข่"
    [selectedDate]="collectDate"
    [markers]="dayMarkers"
    (daySelected)="onDaySelected($event)"
    (closed)="closeCalendar()">
  </app-date-picker-calendar>
</div>
