<div class="arrange-container">
  <header class="header-section">
    <div class="header-content">
      <div class="logo-container clickable-logo" routerLink="/">
        <img src="/assets/images/logo.png" alt="Ez Smart Farm Logo">
      </div>

      <div class="title-group">
        <h1>ระบบเซนเซอร์</h1>
      </div>
    </div>
  </header>

  <main class="content-area">
    <div class="coop-grid">
      <div class="coop-card" *ngFor="let coop of coops">
        <div class="coop-header">
          <span>คอก:</span>
          <input
            type="text"
            class="coop-name-input"
            [value]="coop.name_coop || ('คอกที่ ' + coop.coop_id)"
            readonly
            placeholder="ไม่มีชื่อคอก">
        </div>
        
        <div class="coop-visual" (click)="selectCoop(coop)">
          <div class="green-zone"></div>
          <div class="red-zone"></div>
        </div>
      </div>
    </div>
  </main>
</div>
