<div class="notifications-container">
  <header class="header-section">
    <div class="header-content">
      <div class="logo-container clickable-logo" routerLink="/">
        <img src="assets/images/logo.png" alt="Farm Logo">
      </div>
      <div class="title-group">
        <h1>การแจ้งเตือน</h1>
      </div>
    </div>
  </header>

  <main class="content-area">

    <p class="loading-hint" *ngIf="isLoading">กำลังโหลดการแจ้งเตือน...</p>

    <div class="notification-list" *ngIf="!isLoading">
      <div class="notification-card" *ngFor="let n of notifications" [class.is-urgent]="n.urgent">
        <div class="notification-icon" [class]="'is-' + n.type">
          <svg *ngIf="n.type === 'vaccine'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/>
          </svg>
          <svg *ngIf="n.type === 'health'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/>
            <path d="M6.5 12h2l1.5-2.5L12 14l1.5-3h2.5"/>
          </svg>
          <svg *ngIf="n.type === 'food'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c6.23-.05 7.87-5.57 7.5-10-.36-4.34-3.95-9.96-7.5-10-3.55.04-7.14 5.66-7.5 10-.37 4.43 1.27 9.95 7.5 10Z"/>
          </svg>
        </div>
        <div class="notification-body">
          <p class="notification-title">{{ n.title }}</p>
          <div class="notification-action-row">
            <button type="button" class="notification-action-btn" [class]="'is-' + n.type" (click)="handleAction(n)">
              {{ buttonLabel(n) }}
            </button>
          </div>
        </div>
      </div>

      <p class="empty-hint" *ngIf="notifications.length === 0">ไม่มีการแจ้งเตือน</p>
    </div>
  </main>
</div>
