<div class="dashboard-container">
  <header class="header">
  <div class="logo-container">
    <img src="assets/images/logo.png" alt="Farm Logo">
  </div>

  <h1>EZ - SMART FARM</h1>
</header>

  <main class="main-content">

    <section class="coop-section">
      <div class="section-title-row">
        <h2 class="section-title">คอกไก่ของคุณ</h2>
        <button class="arrange-farm-btn" routerLink="/farm-layout">
          🗺️ จัดวางผังฟาร์ม
        </button>
      </div>

      <div class="coop-grid" cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="drop($event)" *ngIf="coops.length > 0">
        <div
          class="coop-card"
          cdkDrag
          *ngFor="let coop of coops"
          (click)="selectCoop(coop)"
          (mouseenter)="hoveredCoopId = coop.coop_id"
          (mouseleave)="hoveredCoopId = null"
        >
          <div class="coop-hover-anchor" *ngIf="hoveredCoopId === coop.coop_id" (click)="$event.stopPropagation()">
            <app-coop-hover-card [coop]="coop"></app-coop-hover-card>
          </div>
          <div class="coop-card-header">
            <div class="coop-icon">
              <img src="assets/images/coopchicken.png" alt=" Coop Icon">
            </div>
            <div class="coop-info">
              <span class="coop-name">{{ coop.name_coop || 'คอกที่ ' + coop.coop_id }}</span>
              <span class="coop-amount">{{ coop.amount }} ตัว</span>
            </div>
            <button class="coop-edit-btn" title="แก้ไขคอกนี้" (click)="editCoop($event, coop)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
              </svg>
              <span>แก้ไข</span>
            </button>
          </div>

          <div class="device-list" *ngIf="coop.devices && coop.devices.length > 0">
            <h4>อุปกรณ์:</h4>
            <div class="device-icons">
              <div class="device-item"
                *ngFor="let device of coop.devices"
                (mouseenter)="tooltipDeviceId = device.device_id"
                (mouseleave)="tooltipDeviceId = null">
                <img [src]="device.icon || 'assets/images/esp32.png'" [alt]="device.name">
                <span class="device-status" [class.online]="device.current_status === 'Online'"></span>
                <div class="device-tooltip" *ngIf="tooltipDeviceId === device.device_id">
                  <span class="tooltip-name">{{ device.name }}</span>
                  <span class="tooltip-status" [class.online]="device.current_status === 'Online'">
                    {{ device.current_status === 'Online' ? '● Online' : '● Offline' }}
                  </span>
                </div>
              </div>
            </div>
          </div>
          <div class="device-list empty" *ngIf="!coop.devices || coop.devices.length === 0">
            <span>ไม่มีอุปกรณ์</span>
          </div>
        </div>
      </div>

      <div class="coop-empty" *ngIf="coops.length === 0">
        <p>ยังไม่มีคอกไก่ในระบบ</p>
        <button class="empty-add-btn" routerLink="/add-coop">+ เพิ่มคอกไก่</button>
      </div>
    </section>
  </main>

</div>
