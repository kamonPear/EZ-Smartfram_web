<div class="dashboard-container">
  <header class="header">
  <div class="logo-container">
    <img src="assets/images/logo.png" alt="Farm Logo">
  </div>

  <h1>EZ - SMART FARM</h1>
</header>

  <main class="main-content">
    <div class="quick-actions">
      <button class="action-card" routerLink="/add-coop">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="14" r="6"/>
            <circle cx="16" cy="8" r="3"/>
            <path d="M16 5.5 14.5 3.5M17.5 5.5 18.5 3.2"/>
            <path d="M19 8 21.5 8.7 19.3 9.8Z" fill="white" stroke="none"/>
            <path d="M9 19 7.5 21.5M15 19 16.5 21.5"/>
          </svg>
        </div>
        <span class="action-label">เพิ่มคอกไก่</span>
      </button>

      <button class="action-card" routerLink="/arrange">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="2.2"/>
            <circle cx="4" cy="5" r="1.8"/>
            <circle cx="20" cy="5" r="1.8"/>
            <circle cx="4" cy="19" r="1.8"/>
            <circle cx="20" cy="19" r="1.8"/>
            <line x1="10.3" y1="10.4" x2="5.3" y2="6.3"/>
            <line x1="13.7" y1="10.4" x2="18.7" y2="6.3"/>
            <line x1="10.3" y1="13.6" x2="5.3" y2="17.7"/>
            <line x1="13.7" y1="13.6" x2="18.7" y2="17.7"/>
          </svg>
        </div>
        <span class="action-label">เพิ่มอุปกรณ์</span>
      </button>

      <button class="action-card" routerLink="/add-vaccine">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <g transform="rotate(45 12 12)">
              <rect x="9" y="4" width="6" height="10" rx="1"/>
              <line x1="12" y1="2" x2="12" y2="4"/>
              <line x1="12" y1="14" x2="12" y2="20"/>
              <line x1="9.5" y1="7" x2="7" y2="7"/>
              <line x1="9.5" y1="10" x2="7" y2="10"/>
            </g>
          </svg>
        </div>
        <span class="action-label">เพิ่มข้อมูลยาวัคซีน</span>
      </button>

      <button class="action-card" routerLink="/add-egg">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3C9 7 6.5 11 6.5 14.5a5.5 5.5 0 0 0 11 0C17.5 11 15 7 12 3Z"/>
          </svg>
        </div>
        <span class="action-label">เพิ่มข้อมูลไข่ไก่</span>
      </button>

      <button class="action-card" (click)="openTemperatureSettings()">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
          </svg>
        </div>
        <span class="action-label">ตั้งค่าอุณหภูมิ</span>
      </button>

      <button class="action-card" routerLink="/chicken-sensor">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <span class="action-label">สถานะการทำงานของอุปกรณ์</span>
      </button>
    </div>
  </main>

</div>
