<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-container">
        <img src="assets/images/logo.png" alt="EZ Smart Farm Logo">
      </div>
      <div class="title-group">
        <h1>EZ-SmartFarm</h1>
        <p>เข้าสู่ระบบเพื่อจัดการฟาร์มของคุณ</p>
      </div>
    </div>

    <form class="login-form" (ngSubmit)="submit()">
      <div class="field-group">
        <label class="field-label">ชื่อผู้ใช้</label>
        <div class="input-pill">
          <span class="input-pill-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input
            type="text"
            name="username"
            autocomplete="username"
            [(ngModel)]="username"
            placeholder="ชื่อผู้ใช้"
            [disabled]="isSubmitting"
          >
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">รหัสผ่าน</label>
        <div class="input-pill">
          <span class="input-pill-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="10" rx="2"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            [(ngModel)]="password"
            placeholder="รหัสผ่าน"
            [disabled]="isSubmitting"
          >
          <button
            type="button"
            class="input-pill-action-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'"
          >
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.4 19.4 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a19.5 19.5 0 0 1-2.16 3.19"/>
              <path d="M1 1l22 22"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="field-warning login-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="btn-confirm login-submit" [disabled]="isSubmitting">
        <svg *ngIf="!isSubmitting" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        {{ isSubmitting ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ' }}
      </button>
    </form>
  </div>
</div>
