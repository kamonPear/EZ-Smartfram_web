<div class="add-coop-container">
  <header class="header-section">
    <div class="header-content">
      <div class="logo-container clickable-logo" routerLink="/">
        <img src="assets/images/logo.png" alt="Farm Logo">
      </div>
      <div class="title-group">
        <h1>เพิ่มคอกไก่</h1>
      </div>
    </div>
  </header>

  <main class="content-area">
    <div class="form-grid form-grid-single">

      <div class="card info-card">
        <div class="card-title-row">
          <div class="card-title-icon">
              <img src="assets/images/chicken.png" alt="Add coop">
          </div>
          <h2>ข้อมูลไก่</h2>
        </div>

        <div class="field-stack">
          <div class="input-pill" [class.has-error]="isDuplicateName">
            <span class="input-pill-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.6 12.3 12.7 20.2a2 2 0 0 1-2.8 0l-6.1-6.1a2 2 0 0 1 0-2.8L11.7 3.4a2 2 0 0 1 1.4-.6H19a2 2 0 0 1 2 2v5.9a2 2 0 0 1-.4 1.6Z"/>
                <circle cx="16.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/>
              </svg>
            </span>
            <input type="text" [(ngModel)]="coopName" placeholder="ระบุชื่อคอก">
          </div>
          <p class="field-warning" *ngIf="isDuplicateName">ชื่อคอกนี้มีอยู่แล้ว กรุณาใช้ชื่ออื่น</p>

          <div class="input-pill">
            <span class="input-pill-icon">
              <img src="assets/images/chicken.png" alt="Add coop">
            </span>
            <input type="number" [(ngModel)]="chickenCount" placeholder="จำนวนไก่" min="0">
            <span class="input-pill-suffix">ตัว</span>
          </div>

          <div class="input-pill input-pill-clickable" [class.active]="activeField === 'birth'" (click)="selectDateField('birth')">
            <span class="input-pill-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="17" rx="2"/>
                <line x1="3" y1="9" x2="21" y2="9"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
              </svg>
            </span>
            <span class="input-pill-value" [class.placeholder]="!birthDate">{{ birthDate ? formatDate(birthDate) : 'วันเกิดไก่' }}</span>
            <span class="input-pill-action">เลือกวันที่</span>
          </div>

          <div class="input-pill">
            <span class="input-pill-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/>
                <path d="M14 3v5h5"/>
                <line x1="8.5" y1="13" x2="15.5" y2="13"/>
                <line x1="8.5" y1="17" x2="13" y2="17"/>
              </svg>
            </span>
            <input type="text" [(ngModel)]="note" placeholder="หมายเหตุ (ถ้ามี)">
          </div>

          <div class="input-pill input-pill-clickable" [class.active]="activeField === 'received'" (click)="selectDateField('received')">
            <span class="input-pill-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="17" rx="2"/>
                <line x1="3" y1="9" x2="21" y2="9"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
              </svg>
            </span>
            <span class="input-pill-value" [class.placeholder]="!receivedDate">{{ receivedDate ? formatDate(receivedDate) : 'วันที่รับเข้าเลี้ยง' }}</span>
            <span class="input-pill-action">เลือกวันที่</span>
          </div>
        </div>
      </div>

    </div>

    <div class="action-row">
      <button class="btn-cancel" routerLink="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
        ยกเลิก
      </button>
      <button class="btn-confirm" [disabled]="isSaving || isDuplicateName" (click)="addCoop()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        {{ isSaving ? 'กำลังบันทึก...' : 'เพิ่มคอก' }}
      </button>
    </div>
  </main>

  <div class="toast-notification" [class.is-error]="toastType === 'error'" *ngIf="showToast">
    <span>{{ toastMessage }}</span>
  </div>

  <app-date-picker-calendar
    *ngIf="activeField"
    [title]="activeField === 'birth' ? 'วันเกิดไก่' : 'วันที่รับเข้าเลี้ยง'"
    [selectedDate]="activeField === 'birth' ? birthDate : receivedDate"
    [markers]="dayMarkers"
    (daySelected)="onDaySelected($event)"
    (closed)="closeCalendar()">
  </app-date-picker-calendar>
</div>
