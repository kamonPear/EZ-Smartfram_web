<div class="calendar-overlay" (click)="close()">
  <div class="calendar-popup" (click)="$event.stopPropagation()">
    <div class="calendar-popup-header">
      <div class="calendar-popup-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="17" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
        </svg>
      </div>
      <h2>{{ title }}</h2>
      <button class="popup-close" (click)="close()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="calendar-header">
      <button class="nav-btn" (click)="prevMonth()">&lsaquo;</button>
      <span class="month-label">{{ monthLabel }}</span>
      <button class="nav-btn" (click)="nextMonth()">&rsaquo;</button>
    </div>

    <div class="weekday-row">
      <span class="weekday" *ngFor="let d of weekDayLabels">{{ d }}</span>
    </div>

    <div class="week-row" *ngFor="let week of calendarWeeks">
      <button
        class="day-cell"
        *ngFor="let day of week"
        [class.empty]="!day"
        [class.selected]="isSelected(day)"
        [class.today]="isToday(day)"
        [attr.title]="tooltipFor(day) || null"
        [disabled]="!day"
        (click)="selectDay(day)">
        <span class="day-number">{{ day ? day.getDate() : '' }}</span>
        <span class="day-markers" *ngIf="markerFor(day) as marker">
          <span class="marker-dot" [class.due]="marker.vaccineStatus === 'due'" [class.done]="marker.vaccineStatus === 'done'" *ngIf="marker.vaccineStatus"></span>
          <span class="marker-dot health" *ngIf="marker.hasHealth"></span>
        </span>
      </button>
    </div>

    <div class="calendar-legend" *ngIf="markers && markers.size > 0">
      <span><i class="legend-dot due"></i> วัคซีนถึง/เกินกำหนด</span>
      <span><i class="legend-dot done"></i> วัคซีนให้แล้ว</span>
      <span><i class="legend-dot health"></i> มีตรวจสุขภาพ</span>
    </div>
  </div>
</div>
